name: Feature request
description: Suggest a capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the job, not the solution — it often has an answer we didn't think of.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to see
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
